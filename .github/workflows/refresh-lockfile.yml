name: Refresh lockfile

# One-shot helper. It refreshes pnpm-lock.yaml, deletes itself, then starts CI.
on:
  push:
    branches:
      - dependabot/npm_and_yarn/apps/daemon/undici-7.29.1
    paths:
      - .github/workflows/refresh-lockfile.yml

permissions:
  actions: write
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh the lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheSaghbini"
          git config user.email "97866003+TheSaghbini@users.noreply.github.com"
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm update undici@7.29.1 --filter @open-design/daemon --lockfile-only --ignore-scripts
          git add pnpm-lock.yaml
          git rm -f .github/workflows/refresh-lockfile.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh the lockfile for undici 7.29.1"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --input - << EOF
          {"ref":"${GITHUB_REF_NAME}","inputs":{"ci_mode":"hot"}}
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
