name: Join hosted source parts
on:
  workflow_dispatch:
  push:
    branches: [cursor/hosted-image-harness-88c7]
    paths: [.github/workflows/join-hosted-source-parts.yml]
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/hosted-image-harness-88c7
          persist-credentials: true
      - name: Join chat and EntryShell
        run: |
          python3 << 'PY'
          import hashlib
          import pathlib
          import subprocess

          def read_blob(path: str) -> bytes:
              return subprocess.check_output(["git", "cat-file", "blob", f"HEAD:{path}"])

          def blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode()
              return hashlib.sha1(header + data).hexdigest()

          def join(prefix: str, count: int, expected: str, dest: str) -> None:
              data = b"".join(
                  read_blob(f"deploy/hosted/_parts/{prefix}-{index}.bin")
                  for index in range(count)
              )
              digest = blob_sha(data)
              if digest != expected:
                  raise SystemExit(f"{dest} digest {digest} != {expected}")
              path = pathlib.Path(dest)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f"{dest} {digest} {len(data)}")

          join(
              "chat",
              10,
              "4afeaad2e44b86cbcdce691d0d58e6d882fa4c0e",
              "apps/daemon/src/routes/chat.ts",
          )
          join(
              "entry",
              20,
              "4ae0e5ddb8390ffc2e280a4ae6a1134527b4954f",
              "apps/web/src/components/EntryShell.tsx",
          )
          PY
          git rm -f deploy/hosted/_parts/chat-*.bin deploy/hosted/_parts/entry-*.bin .github/workflows/join-hosted-source-parts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/daemon/src/routes/chat.ts apps/web/src/components/EntryShell.tsx
          git commit -m "Replace chat and EntryShell with the disk files."
          git push origin HEAD:cursor/hosted-image-harness-88c7
